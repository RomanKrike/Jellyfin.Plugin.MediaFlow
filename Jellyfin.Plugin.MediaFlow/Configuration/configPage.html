<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MediaFlow</title>
</head>
<body>
<div id="MediaFlowConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
    <style>
        #MediaFlowConfigPage {
            --mf-accent:#00a4dc;
            --mf-accent-soft:rgba(0,164,220,.14);
            --mf-border:rgba(255,255,255,.105);
            --mf-panel:rgba(255,255,255,.045);
            --mf-panel-strong:rgba(255,255,255,.07);
            --mf-muted:rgba(255,255,255,.58);
            --mf-good:#63d595;
            --mf-warn:#f1c15b;
            --mf-bad:#ff8585;
            padding-bottom:3rem;
        }
        #MediaFlowConfigPage * { box-sizing:border-box; }
        #MediaFlowConfigPage .content-primary { max-width:1500px; margin:0 auto; }
        #MediaFlowConfigPage button, #MediaFlowConfigPage input, #MediaFlowConfigPage select { font:inherit; }
        #MediaFlowConfigPage .mf-header { display:flex; align-items:flex-start; justify-content:space-between; gap:1.4rem; margin-bottom:1rem; }
        #MediaFlowConfigPage .mf-title-row { display:flex; align-items:baseline; gap:.65rem; flex-wrap:wrap; }
        #MediaFlowConfigPage .mf-title { margin:0; font-size:2rem; font-weight:500; }
        #MediaFlowConfigPage .mf-version { color:var(--mf-muted); font-size:.82rem; }
        #MediaFlowConfigPage .mf-subtitle { opacity:.68; margin:.35rem 0 0; max-width:820px; line-height:1.45; }
        #MediaFlowConfigPage .mf-header-actions { display:flex; gap:.7rem; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
        #MediaFlowConfigPage .mf-healthbar { display:flex; flex-wrap:wrap; gap:.55rem; margin:.8rem 0 1.25rem; }
        #MediaFlowConfigPage .mf-health-chip { display:flex; align-items:center; gap:.45rem; border:1px solid var(--mf-border); background:rgba(255,255,255,.035); border-radius:999px; padding:.36rem .68rem; font-size:.82rem; }
        #MediaFlowConfigPage .mf-health-dot { width:.5rem; height:.5rem; border-radius:50%; background:#777; box-shadow:0 0 0 3px rgba(255,255,255,.03); }
        #MediaFlowConfigPage .mf-health-chip.ok .mf-health-dot { background:var(--mf-good); }
        #MediaFlowConfigPage .mf-health-chip.warn .mf-health-dot { background:var(--mf-warn); }
        #MediaFlowConfigPage .mf-health-chip.err .mf-health-dot { background:var(--mf-bad); }
        #MediaFlowConfigPage .mf-health-name { opacity:.65; }
        #MediaFlowConfigPage .mf-health-value { font-weight:600; }
        #MediaFlowConfigPage .mf-tabs { display:flex; gap:.35rem; flex-wrap:wrap; border-bottom:1px solid var(--mf-border); margin:0 0 1.35rem; }
        #MediaFlowConfigPage .mf-tab { appearance:none; -webkit-appearance:none; border:0; background:transparent; color:inherit; opacity:.68; padding:.8rem .95rem; cursor:pointer; border-bottom:3px solid transparent; border-radius:0; font-weight:500; }
        #MediaFlowConfigPage .mf-tab:hover { opacity:.9; }
        #MediaFlowConfigPage .mf-tab.active { opacity:1; border-bottom-color:var(--mf-accent); color:#fff; }
        #MediaFlowConfigPage .mf-tab-count { display:inline-block; min-width:1.3rem; margin-left:.3rem; padding:.05rem .35rem; border-radius:999px; background:rgba(255,255,255,.09); font-size:.72rem; text-align:center; }
        #MediaFlowConfigPage .mf-tab.active .mf-tab-count { background:var(--mf-accent-soft); }
        #MediaFlowConfigPage .mf-pane { display:none; }
        #MediaFlowConfigPage .mf-pane.active { display:block; }
        #MediaFlowConfigPage .mf-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:.85rem; margin-bottom:1.2rem; }
        #MediaFlowConfigPage .mf-card { background:var(--mf-panel); border:1px solid var(--mf-border); border-radius:13px; padding:1.05rem 1.15rem; box-shadow:0 1px 0 rgba(255,255,255,.02) inset; }
        #MediaFlowConfigPage .mf-metric-label { opacity:.63; font-size:.86rem; }
        #MediaFlowConfigPage .mf-metric-value { font-size:1.85rem; font-weight:600; margin-top:.25rem; line-height:1.15; }
        #MediaFlowConfigPage .mf-metric-note { color:var(--mf-muted); font-size:.79rem; margin-top:.38rem; min-height:1em; }
        #MediaFlowConfigPage .mf-section-title { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin:1.35rem 0 .7rem; }
        #MediaFlowConfigPage .mf-section-title h3 { margin:0; font-size:1.1rem; font-weight:500; }
        #MediaFlowConfigPage .mf-toolbar { display:flex; gap:.7rem; align-items:center; justify-content:space-between; flex-wrap:wrap; margin:.2rem 0 1rem; }
        #MediaFlowConfigPage .mf-toolbar-left { display:flex; gap:.6rem; align-items:center; flex:1; flex-wrap:wrap; }
        #MediaFlowConfigPage .mf-search { min-width:280px; max-width:560px; flex:1; }
        #MediaFlowConfigPage .mf-select { min-width:185px; color:inherit; background:#282828; border:1px solid var(--mf-border); border-radius:4px; padding:.58rem .7rem; }
        #MediaFlowConfigPage .mf-secondary { color:var(--mf-muted); font-size:.8rem; line-height:1.35; word-break:break-word; }
        #MediaFlowConfigPage .mf-badge { display:inline-block; border-radius:999px; padding:.22rem .55rem; font-size:.75rem; line-height:1.25; background:rgba(255,255,255,.11); white-space:nowrap; }
        #MediaFlowConfigPage .mf-badge.ok { background:rgba(41,190,105,.18); color:#69d998; }
        #MediaFlowConfigPage .mf-badge.warn { background:rgba(241,179,52,.18); color:#f1c15b; }
        #MediaFlowConfigPage .mf-badge.err { background:rgba(230,79,79,.18); color:#ff8585; }
        #MediaFlowConfigPage .mf-badge.info { background:rgba(0,164,220,.18); color:#60c8eb; }
        #MediaFlowConfigPage .mf-badge.season { background:rgba(130,95,210,.18); color:#c7b6ff; }
        #MediaFlowConfigPage .mf-season-chips { display:inline-flex; gap:.32rem; align-items:center; flex-wrap:wrap; }
        #MediaFlowConfigPage .mf-progress { width:100%; height:7px; border-radius:999px; overflow:hidden; background:rgba(255,255,255,.11); }
        #MediaFlowConfigPage .mf-progress > span { display:block; height:100%; background:var(--mf-accent); border-radius:inherit; }
        #MediaFlowConfigPage .mf-mini-btn { appearance:none; -webkit-appearance:none; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.055); color:inherit; border-radius:7px; padding:.48rem .72rem; cursor:pointer; }
        #MediaFlowConfigPage .mf-mini-btn:hover { background:rgba(255,255,255,.1); }
        #MediaFlowConfigPage .mf-mini-btn.primary { background:#087da5; border-color:#1498c5; color:#fff; }
        #MediaFlowConfigPage .mf-mini-btn.danger { border-color:rgba(230,79,79,.45); color:#ff9b9b; }
        #MediaFlowConfigPage .mf-mini-btn.subtle { border-color:transparent; background:transparent; color:var(--mf-muted); }
        #MediaFlowConfigPage .mf-actions { display:flex; gap:.4rem; align-items:center; flex-wrap:wrap; }
        #MediaFlowConfigPage .mf-action-menu { position:relative; z-index:2; }
        #MediaFlowConfigPage .mf-action-menu > summary { list-style:none; cursor:pointer; user-select:none; }
        #MediaFlowConfigPage .mf-action-menu > summary::-webkit-details-marker { display:none; }
        #MediaFlowConfigPage .mf-action-menu[open] { z-index:200; }
        #MediaFlowConfigPage .mf-action-menu[open] > summary { background:rgba(255,255,255,.11); }
        #MediaFlowConfigPage .mf-action-menu-pop { position:absolute; right:0; top:calc(100% + .4rem); z-index:500; min-width:230px; display:grid; gap:.35rem; padding:.45rem; border:1px solid rgba(255,255,255,.16); border-radius:9px; background:#202020; box-shadow:0 12px 35px rgba(0,0,0,.45); }
        #MediaFlowConfigPage .mf-action-menu-pop .mf-mini-btn { width:100%; text-align:left; }
        #MediaFlowConfigPage .mf-action-menu-note { padding:.3rem .45rem .1rem; color:var(--mf-muted); font-size:.7rem; line-height:1.3; }
        #MediaFlowConfigPage .mf-action-divider { height:1px; background:rgba(255,255,255,.09); margin:.15rem 0; }

        #MediaFlowConfigPage .mf-torrent-list { display:grid; gap:.75rem; }
        #MediaFlowConfigPage .mf-torrent-card { display:grid; grid-template-columns:68px minmax(0,1fr) minmax(210px,300px) auto; gap:1rem; align-items:center; padding:1rem; background:rgba(255,255,255,.035); border:1px solid var(--mf-border); border-radius:13px; }
        #MediaFlowConfigPage .mf-torrent-card:hover { background:rgba(255,255,255,.05); }
        #MediaFlowConfigPage .mf-media-mark { width:68px; height:82px; display:flex; align-items:center; justify-content:center; border-radius:9px; background:linear-gradient(145deg,rgba(0,164,220,.22),rgba(255,255,255,.035)); border:1px solid rgba(0,164,220,.18); color:#8edcf6; font-weight:700; font-size:.78rem; letter-spacing:.05em; }
        #MediaFlowConfigPage .mf-torrent-main { min-width:0; }
        #MediaFlowConfigPage .mf-torrent-name { font-size:1rem; font-weight:600; line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        #MediaFlowConfigPage .mf-torrent-meta { display:flex; gap:.45rem; align-items:center; flex-wrap:wrap; margin-top:.42rem; }
        #MediaFlowConfigPage .mf-hash { color:var(--mf-muted); font-size:.72rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:420px; }
        #MediaFlowConfigPage .mf-torrent-progress { min-width:0; }
        #MediaFlowConfigPage .mf-progress-row { display:flex; justify-content:space-between; gap:.7rem; align-items:center; margin-bottom:.4rem; font-size:.8rem; }
        #MediaFlowConfigPage .mf-file-stats { display:flex; gap:.55rem; flex-wrap:wrap; margin-top:.45rem; color:var(--mf-muted); font-size:.76rem; }
        #MediaFlowConfigPage .mf-file-stats .good { color:var(--mf-good); }
        #MediaFlowConfigPage .mf-file-stats .warn { color:var(--mf-warn); }
        #MediaFlowConfigPage .mf-file-stats .bad { color:var(--mf-bad); }

        #MediaFlowConfigPage .mf-table-wrap { overflow:auto; border:1px solid var(--mf-border); border-radius:12px; background:rgba(0,0,0,.12); }
        #MediaFlowConfigPage table.mf-table { width:100%; border-collapse:collapse; min-width:900px; }
        #MediaFlowConfigPage .mf-table th, #MediaFlowConfigPage .mf-table td { text-align:left; padding:.82rem .85rem; border-bottom:1px solid rgba(255,255,255,.07); vertical-align:middle; }
        #MediaFlowConfigPage .mf-table th { opacity:.62; font-weight:500; font-size:.83rem; }
        #MediaFlowConfigPage .mf-table tr:last-child td { border-bottom:0; }
        #MediaFlowConfigPage .mf-path { max-width:560px; word-break:break-word; }
        #MediaFlowConfigPage .mf-empty { padding:2.2rem; text-align:center; color:var(--mf-muted); border:1px dashed rgba(255,255,255,.1); border-radius:12px; }

        #MediaFlowConfigPage .mf-review-list { display:grid; gap:1rem; }
        #MediaFlowConfigPage .mf-review-item { border:1px solid var(--mf-border); border-radius:14px; background:rgba(255,255,255,.035); overflow:hidden; }
        #MediaFlowConfigPage .mf-review-head { padding:1rem 1.1rem; border-bottom:1px solid rgba(255,255,255,.07); display:flex; justify-content:space-between; gap:1rem; align-items:flex-start; }
        #MediaFlowConfigPage .mf-review-title { font-weight:600; word-break:break-word; }
        #MediaFlowConfigPage .mf-review-reason { color:var(--mf-muted); font-size:.82rem; margin-top:.4rem; line-height:1.45; }
        #MediaFlowConfigPage .mf-review-body { padding:1rem 1.1rem 1.15rem; }
        #MediaFlowConfigPage .mf-review-searchbar { display:flex; gap:.55rem; align-items:center; margin-bottom:1rem; }
        #MediaFlowConfigPage .mf-review-search { flex:1; min-width:240px; }
        #MediaFlowConfigPage .mf-candidates { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:.75rem; }
        #MediaFlowConfigPage .mf-candidate { display:grid; grid-template-columns:82px minmax(0,1fr); gap:.75rem; padding:.7rem; border:1px solid rgba(255,255,255,.08); border-radius:11px; background:rgba(0,0,0,.14); min-height:132px; }
        #MediaFlowConfigPage .mf-poster { width:82px; height:123px; object-fit:cover; border-radius:7px; background:rgba(255,255,255,.06); }
        #MediaFlowConfigPage .mf-poster-empty { width:82px; height:123px; border-radius:7px; display:flex; align-items:center; justify-content:center; background:linear-gradient(145deg,rgba(0,164,220,.13),rgba(255,255,255,.035)); color:var(--mf-muted); font-size:.7rem; text-align:center; padding:.3rem; }
        #MediaFlowConfigPage .mf-candidate-info { min-width:0; display:flex; flex-direction:column; }
        #MediaFlowConfigPage .mf-candidate-title { font-weight:600; line-height:1.3; }
        #MediaFlowConfigPage .mf-candidate-original { color:var(--mf-muted); font-size:.76rem; margin-top:.2rem; }
        #MediaFlowConfigPage .mf-candidate-score { display:flex; gap:.35rem; flex-wrap:wrap; margin:.45rem 0; }
        #MediaFlowConfigPage .mf-candidate-actions { margin-top:auto; padding-top:.45rem; }


        #MediaFlowConfigPage .mf-rich-card { position:relative; display:grid; grid-template-columns:112px minmax(0,1fr); gap:1rem; padding:1rem; background:rgba(255,255,255,.035); border:1px solid var(--mf-border); border-radius:14px; overflow:visible; }
        #MediaFlowConfigPage .mf-rich-card:hover { background:rgba(255,255,255,.048); }
        #MediaFlowConfigPage .mf-rich-card.downloading { border-color:rgba(0,164,220,.48); box-shadow:inset 3px 0 0 var(--mf-accent); }
        #MediaFlowConfigPage .mf-badge.downloading::before { content:''; display:inline-block; width:.42rem; height:.42rem; margin-right:.38rem; border-radius:50%; background:currentColor; vertical-align:.04rem; animation:mfDownloadPulse 1.35s ease-in-out infinite; }
        @keyframes mfDownloadPulse { 0%,100% { opacity:.35; transform:scale(.8); } 50% { opacity:1; transform:scale(1.15); } }
        #MediaFlowConfigPage .mf-rich-cover { width:112px; height:168px; border-radius:9px; object-fit:cover; background:linear-gradient(145deg,rgba(0,164,220,.2),rgba(255,255,255,.04)); border:1px solid rgba(255,255,255,.08); }
        #MediaFlowConfigPage .mf-rich-cover-empty { width:112px; height:168px; border-radius:9px; display:flex; align-items:center; justify-content:center; text-align:center; padding:.5rem; color:#8edcf6; font-weight:700; font-size:.76rem; letter-spacing:.05em; background:linear-gradient(145deg,rgba(0,164,220,.2),rgba(255,255,255,.04)); border:1px solid rgba(0,164,220,.18); }
        #MediaFlowConfigPage .mf-rich-body { min-width:0; display:flex; flex-direction:column; gap:.75rem; }
        #MediaFlowConfigPage .mf-rich-top { display:flex; justify-content:space-between; gap:1rem; align-items:flex-start; }
        #MediaFlowConfigPage .mf-rich-title { font-size:1.08rem; font-weight:650; line-height:1.3; word-break:break-word; }
        #MediaFlowConfigPage .mf-rich-release { color:var(--mf-muted); font-size:.78rem; margin-top:.25rem; line-height:1.35; word-break:break-word; }
        #MediaFlowConfigPage .mf-rich-progress { display:grid; grid-template-columns:minmax(170px,1fr) auto; gap:.85rem; align-items:end; }
        #MediaFlowConfigPage .mf-rich-summary { display:flex; gap:.55rem; align-items:center; flex-wrap:wrap; }
        #MediaFlowConfigPage .mf-rich-actions { display:flex; gap:.4rem; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
        #MediaFlowConfigPage .mf-details { grid-column:1 / -1; display:none; border-top:1px solid rgba(255,255,255,.08); padding-top:.9rem; margin-top:.1rem; }
        #MediaFlowConfigPage .mf-rich-card.expanded .mf-details { display:block; }
        #MediaFlowConfigPage .mf-detail-head { display:flex; justify-content:space-between; gap:1rem; align-items:center; margin-bottom:.65rem; }
        #MediaFlowConfigPage .mf-detail-title { font-weight:600; }
        #MediaFlowConfigPage .mf-file-list { display:grid; gap:.35rem; }
        #MediaFlowConfigPage .mf-file-row { display:grid; grid-template-columns:86px minmax(0,1fr) 120px 150px; gap:.7rem; align-items:center; padding:.58rem .65rem; border-radius:8px; background:rgba(0,0,0,.14); border:1px solid rgba(255,255,255,.055); }
        #MediaFlowConfigPage .mf-file-episode { font-weight:650; color:#a9def0; }
        #MediaFlowConfigPage .mf-file-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        #MediaFlowConfigPage .mf-file-progress { font-size:.78rem; color:var(--mf-muted); }
        #MediaFlowConfigPage .mf-hardlink.ok { color:var(--mf-good); }
        #MediaFlowConfigPage .mf-hardlink.err { color:var(--mf-bad); }
        #MediaFlowConfigPage .mf-hardlink.warn { color:var(--mf-warn); }
        #MediaFlowConfigPage .mf-detail-loading { padding:1.2rem; color:var(--mf-muted); text-align:center; }

        #MediaFlowConfigPage .mf-log-toolbar { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; margin-bottom:.9rem; }
        #MediaFlowConfigPage .mf-log-list { display:grid; gap:.4rem; }
        #MediaFlowConfigPage .mf-log-row { display:grid; grid-template-columns:165px 90px 110px minmax(0,1fr); gap:.75rem; align-items:start; padding:.68rem .75rem; border:1px solid rgba(255,255,255,.07); border-radius:8px; background:rgba(0,0,0,.13); }
        #MediaFlowConfigPage .mf-log-row.error { border-color:rgba(230,79,79,.25); background:rgba(230,79,79,.055); }
        #MediaFlowConfigPage .mf-log-row.warning { border-color:rgba(241,179,52,.2); background:rgba(241,179,52,.04); }
        #MediaFlowConfigPage .mf-log-time, #MediaFlowConfigPage .mf-log-source { color:var(--mf-muted); font-size:.78rem; }
        #MediaFlowConfigPage .mf-log-message { line-height:1.4; word-break:break-word; }
        #MediaFlowConfigPage .mf-log-context { color:var(--mf-muted); font-size:.72rem; margin-top:.25rem; word-break:break-word; }

        #MediaFlowConfigPage .mf-settings-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:1rem; }
        #MediaFlowConfigPage .mf-settings-grid h3 { margin:.1rem 0 .9rem; font-size:1.05rem; font-weight:500; display:flex; justify-content:space-between; gap:.6rem; align-items:center; }
        #MediaFlowConfigPage .mf-toast { display:none; position:fixed; right:1.4rem; bottom:1.4rem; z-index:10000; background:#222; border:1px solid rgba(255,255,255,.15); border-radius:8px; padding:.8rem 1rem; max-width:440px; box-shadow:0 8px 30px rgba(0,0,0,.35); }
        #MediaFlowConfigPage .mf-toast.show { display:block; }

        @media (max-width:1050px) {
            #MediaFlowConfigPage .mf-torrent-card { grid-template-columns:58px minmax(0,1fr) auto; }
            #MediaFlowConfigPage .mf-media-mark { width:58px; height:72px; }
            #MediaFlowConfigPage .mf-torrent-progress { grid-column:2 / -1; }
        }
        @media (max-width:760px) {
            #MediaFlowConfigPage .mf-header { flex-direction:column; }
            #MediaFlowConfigPage .mf-header-actions { justify-content:flex-start; }
            #MediaFlowConfigPage .mf-settings-grid { grid-template-columns:1fr; }
            #MediaFlowConfigPage .mf-title { font-size:1.65rem; }
            #MediaFlowConfigPage .mf-torrent-card { grid-template-columns:52px minmax(0,1fr); }
            #MediaFlowConfigPage .mf-media-mark { width:52px; height:66px; }
            #MediaFlowConfigPage .mf-torrent-progress, #MediaFlowConfigPage .mf-torrent-actions { grid-column:1 / -1; }
            #MediaFlowConfigPage .mf-review-head { flex-direction:column; }
            #MediaFlowConfigPage .mf-review-searchbar { flex-wrap:wrap; }
            #MediaFlowConfigPage .mf-rich-card { grid-template-columns:76px minmax(0,1fr); }
            #MediaFlowConfigPage .mf-rich-cover, #MediaFlowConfigPage .mf-rich-cover-empty { width:76px; height:114px; }
            #MediaFlowConfigPage .mf-rich-top, #MediaFlowConfigPage .mf-rich-progress { display:block; }
            #MediaFlowConfigPage .mf-rich-actions { justify-content:flex-start; margin-top:.65rem; }
            #MediaFlowConfigPage .mf-file-row { grid-template-columns:70px minmax(0,1fr); }
            #MediaFlowConfigPage .mf-file-progress, #MediaFlowConfigPage .mf-hardlink { grid-column:2; }
            #MediaFlowConfigPage .mf-log-row { grid-template-columns:1fr; gap:.25rem; }
        }
    </style>

    <div data-role="content">
        <div class="content-primary">
            <div class="mf-header">
                <div>
                    <div class="mf-title-row">
                        <h2 class="mf-title">MediaFlow</h2>
                        <span id="mfVersion" class="mf-version"></span>
                    </div>
                    <p class="mf-subtitle" data-i18n="app.subtitle"></p>
                </div>
                <div class="mf-header-actions">
                    <button id="mfRefreshTop" type="button" is="emby-button" class="raised emby-button"><span data-i18n="common.refreshScreen"></span></button>
                </div>
            </div>

            <div class="mf-healthbar">
                <div id="mfHealthWorker" class="mf-health-chip"><span class="mf-health-dot"></span><span class="mf-health-name">Worker</span><span class="mf-health-value">—</span></div>
                <div id="mfHealthQb" class="mf-health-chip"><span class="mf-health-dot"></span><span class="mf-health-name">qBittorrent</span><span class="mf-health-value">—</span></div>
                <div id="mfHealthTmdb" class="mf-health-chip"><span class="mf-health-dot"></span><span class="mf-health-name">TMDb</span><span class="mf-health-value">—</span></div>
            </div>

            <div class="mf-tabs">
                <button class="mf-tab active" type="button" data-tab="overview" data-i18n="tabs.overview"></button>
                <button class="mf-tab" type="button" data-tab="queue"><span data-i18n="tabs.torrents"></span> <span id="mfTabTorrentCount" class="mf-tab-count">0</span></button>
                <button class="mf-tab" type="button" data-tab="review"><span data-i18n="tabs.review"></span> <span id="mfTabReviewCount" class="mf-tab-count">0</span></button>
                <button class="mf-tab" type="button" data-tab="history" data-i18n="tabs.history"></button>
                <button class="mf-tab" type="button" data-tab="logs" data-i18n="tabs.logs"></button>
                <button class="mf-tab" type="button" data-tab="settings" data-i18n="tabs.settings"></button>
            </div>

            <section id="mfPane-overview" class="mf-pane active">
                <div class="mf-grid">
                    <div class="mf-card"><div class="mf-metric-label" data-i18n="metrics.active"></div><div id="mfMetricActive" class="mf-metric-value">—</div><div class="mf-metric-note" data-i18n="metrics.activeNote"></div></div>
                    <div class="mf-card"><div class="mf-metric-label" data-i18n="metrics.review"></div><div id="mfMetricReview" class="mf-metric-value">—</div><div class="mf-metric-note" data-i18n="metrics.reviewNote"></div></div>
                    <div class="mf-card"><div class="mf-metric-label" data-i18n="metrics.errors"></div><div id="mfMetricFailed" class="mf-metric-value">—</div><div class="mf-metric-note" data-i18n="metrics.errorsNote"></div></div>
                    <div class="mf-card"><div class="mf-metric-label" data-i18n="metrics.imported"></div><div id="mfMetricImported" class="mf-metric-value">—</div><div id="mfMetricImportedNote" class="mf-metric-note">—</div></div>
                </div>

                <div class="mf-section-title"><h3 data-i18n="overview.recentTorrents"></h3><button type="button" class="mf-mini-btn" data-go-tab="queue" data-i18n="common.showAll"></button></div>

<script type="text/javascript">
(() => {
    const page = document.querySelector('#MediaFlowConfigPage');
    if (!page) return;

    const pluginUniqueId = '9c98f2dc-f6d7-4f41-9e7f-84f6cf25d8bb';
    const posterBase = 'https://image.tmdb.org/t/p/w342';
    const textIds = [
        'QbittorrentUrl','QbittorrentUsername','QbittorrentPassword','QbittorrentMovieCategory','QbittorrentTvCategory','QbittorrentPathPrefix','LocalDownloadsPathPrefix',
        'TmdbApiKey','TmdbLanguage','TmdbFallbackLanguage','MoviesRoot','ShowsRoot','PollIntervalSeconds','AutoMatchScore','MinimumScoreGap','MinimumVideoSizeMb',
        'DryRunTorrentFilter','DryRunMaxFiles','RetryFailedAfterMinutes','VideoExtensions'
    ];
    const checkIds = ['Enabled','ManageSequentialEpisodes','BaselineExistingTorrentsOnFirstRun','DryRunMode','QbittorrentIgnoreTlsErrors'];
    const reviewSearchResults = new Map();
    const torrentDetailsCache = new Map();
    let logEntries = [];
    let overview = null;
    let strings = Object.create(null);
    let uiCulture = 'en-US';

    function tr(key, vars) {
        let value = Object.prototype.hasOwnProperty.call(strings, key) ? strings[key] : key;
        if (vars) {
            Object.keys(vars).forEach(function(name) {
                value = String(value).split('{' + name + '}').join(String(vars[name] == null ? '' : vars[name]));
            });
        }
        return value;
    }

    function applyLocalization() {
        page.querySelectorAll('[data-i18n]').forEach(function(el) { el.textContent = tr(el.dataset.i18n); });
        page.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) { el.setAttribute('placeholder', tr(el.dataset.i18nPlaceholder)); });
        document.documentElement.setAttribute('lang', uiCulture);
    }

    async function loadLocalization() {
        const requested = document.documentElement.lang || navigator.language || 'en-US';
        try {
            strings = await api('GET', 'MediaFlow/Admin/i18n?culture=' + encodeURIComponent(requested));
            uiCulture = String(requested).toLowerCase().startsWith('ru') ? 'ru-RU' : 'en-US';
        } catch (_) {
            strings = await api('GET', 'MediaFlow/Admin/i18n?culture=en-US');
            uiCulture = 'en-US';
        }
        applyLocalization();
    }

    function api(method, path, body) {
        const options = {
            type: method,
            url: window.ApiClient.getUrl(path),
            dataType: 'json'
        };
        if (body !== undefined) {
            options.contentType = 'application/json';
            options.data = JSON.stringify(body);
        }
        return window.ApiClient.ajax(options);
    }

    function esc(value) {
        return String(value == null ? '' : value).replace(/[&<>'"]/g, function(c) {
            return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c];
        });
    }

    function fmtBytes(bytes) {
        const n = Number(bytes || 0);
        if (!n) return '—';
        const units = ['B','KB','MB','GB','TB'];
        let x = n;
        let i = 0;
        while (x >= 1024 && i < units.length - 1) {
            x /= 1024;
            i++;
        }
        return x.toFixed(i >= 3 ? 1 : 0) + ' ' + units[i];
    }

    function fmtDate(value) {
        if (!value) return '—';
        try { return new Date(value).toLocaleString(uiCulture); }
        catch (_) { return value; }
    }

    function fileName(path) {
        if (!path) return '—';
        const parts = String(path).replace(/\\/g, '/').split('/');
        return parts[parts.length - 1] || path;
    }

    function statusLabel(status) {
        const keyMap = {
            Downloading:'status.downloading',
            Ready:'status.ready',
            Baseline:'status.baseline',
            NeedsReview:'status.needsReview',
            Failed:'status.failed',
            Imported:'status.imported',
            Ignored:'status.ignored'
        };
        return keyMap[status] ? tr(keyMap[status]) : (status || '—');
    }

    function statusClass(status) {
        if (status === 'Imported' || status === 'Ready') return 'ok';
        if (status === 'Downloading') return 'info downloading';
        if (status === 'NeedsReview' || status === 'Baseline' || status === 'Ignored') return 'warn';
        if (status === 'Failed') return 'err';
        return 'info';
    }

    function effectiveTorrentStatus(t) {
        const raw = t && t.mediaFlowStatus ? String(t.mediaFlowStatus) : '';
        // Error/review/baseline states are more important than download progress.
        if (raw === 'NeedsReview' || raw === 'Failed' || raw === 'Baseline' || raw === 'Ignored') return raw;
        // A season pack stays visibly active while qBittorrent still has data to download,
        // even if every episode completed so far has already been Imported.
        if (Number((t && t.progress) || 0) < 0.999999) return 'Downloading';
        return raw || 'Ready';
    }

    function mediaMark(category) {
        const cfg = window.__mfConfigCache || {};
        if (String(category || '').toLowerCase() === String(cfg.QbittorrentTvCategory || 'tv').toLowerCase()) return 'TV';
        if (String(category || '').toLowerCase() === String(cfg.QbittorrentMovieCategory || 'movie').toLowerCase()) return tr('media.movie');
        return category ? String(category).toUpperCase().slice(0, 6) : tr('media.media');
    }

    function setHealth(id, connected, value, title, warning) {
        const el = page.querySelector('#' + id);
        if (!el) return;
        el.classList.remove('ok','warn','err');
        el.classList.add(connected ? (warning ? 'warn' : 'ok') : 'err');
        const valueEl = el.querySelector('.mf-health-value');
        if (valueEl) valueEl.textContent = value || (connected ? tr('common.connected') : tr('common.disconnected'));
        el.title = title || '';
    }

    function setTab(name) {
        page.querySelectorAll('.mf-tab').forEach(function(x) { x.classList.toggle('active', x.dataset.tab === name); });
        page.querySelectorAll('.mf-pane').forEach(function(x) { x.classList.toggle('active', x.id === 'mfPane-' + name); });
        if (name === 'review') renderReview();
        if (name === 'queue') renderQueue();
        if (name === 'history') renderHistory();
        if (name === 'logs') loadLogs(false);
    }

    function toast(message) {
        const el = page.querySelector('#mfToast');
        el.textContent = message;
        el.classList.add('show');
        clearTimeout(el._mfTimer);
        el._mfTimer = setTimeout(function() { el.classList.remove('show'); }, 4200);
    }

    function torrentFileStats(t) {
        const parts = [];
        if (t.importedFiles) parts.push('<span class="good">' + esc(tr('torrent.stats.imported', {count:t.importedFiles})) + '</span>');
        if (t.reviewFiles) parts.push('<span class="warn">' + esc(tr('torrent.stats.review', {count:t.reviewFiles})) + '</span>');
        if (t.failedFiles) parts.push('<span class="bad">' + esc(tr('torrent.stats.failed', {count:t.failedFiles})) + '</span>');
        if (!parts.length) parts.push('<span>' + esc(tr('torrent.stats.tracked', {count:t.trackedFiles || 0})) + '</span>');
        return parts.join('');
    }

    function qbStatusInfo(state) {
        const raw = String(state || '').trim();
        const map = {
            downloading: ['qbStatus.downloading', 'info downloading'],
            forcedDL: ['qbStatus.downloading', 'info downloading'],
            metaDL: ['qbStatus.metadata', 'warn'],
            allocating: ['qbStatus.preparing', 'warn'],
            queuedDL: ['qbStatus.queued', 'warn'],
            pausedDL: ['qbStatus.paused', ''],
            stalledDL: ['qbStatus.stalled', 'warn'],
            checkingDL: ['qbStatus.checking', 'info'],
            checkingResumeData: ['qbStatus.checking', 'info'],
            moving: ['qbStatus.moving', 'info'],

            uploading: ['qbStatus.seeding', 'ok'],
            forcedUP: ['qbStatus.seeding', 'ok'],
            queuedUP: ['qbStatus.queued', 'warn'],
            pausedUP: ['qbStatus.paused', ''],
            stalledUP: ['qbStatus.stalled', 'warn'],
            checkingUP: ['qbStatus.checking', 'info'],

            error: ['qbStatus.error', 'err'],
            missingFiles: ['qbStatus.missingFiles', 'err'],
            unknown: ['qbStatus.unknown', '']
        };

        const item = map[raw] || ['qbStatus.unknown', ''];
        return {
            label: tr(item[0]),
            className: item[1]
        };
    }

    function torrentCard(t, compact) {
        const pct = Math.max(0, Math.min(100, Number(t.progress || 0) * 100));
        const sizeText = fmtBytes(t.downloaded) + ' / ' + fmtBytes(t.size);
        const displayStatus = effectiveTorrentStatus(t);
        const qbStatus = qbStatusInfo(t.qbState);
        const actions = '<div class="mf-rich-actions">'
            + (!compact ? '<button type="button" class="mf-mini-btn" data-action="toggle-details" data-hash="' + esc(t.hash) + '">' + esc(tr('common.files')) + '</button>' : '')
            + '<button type="button" class="mf-mini-btn" data-action="reconcile" data-hash="' + esc(t.hash) + '" data-name="' + esc(t.name) + '">' + esc(tr('common.reconcile')) + '</button>'
            + '<button type="button" class="mf-mini-btn primary" data-action="reprocess" data-hash="' + esc(t.hash) + '">' + esc(tr('common.reprocess')) + '</button>'
            + '<details class="mf-action-menu">'
                + '<summary class="mf-mini-btn">' + esc(tr('common.more')) + '</summary>'
                + '<div class="mf-action-menu-pop">'
                    + '<div class="mf-action-menu-note">' + esc(tr('torrent.actionsIndependent')) + '</div>'
                    + '<button type="button" class="mf-mini-btn danger" data-action="delete-jellyfin" data-hash="' + esc(t.hash) + '" data-name="' + esc(t.name) + '">' + esc(tr('torrent.deleteJellyfin')) + '</button>'
                    + '<button type="button" class="mf-mini-btn danger" data-action="delete-qb" data-hash="' + esc(t.hash) + '" data-name="' + esc(t.name) + '">' + esc(tr('torrent.deleteQb')) + '</button>'
                    + '<button type="button" class="mf-mini-btn danger" data-action="delete-qb-files" data-hash="' + esc(t.hash) + '" data-name="' + esc(t.name) + '">' + esc(tr('torrent.deleteQbFiles')) + '</button>'
                    + '<div class="mf-action-divider"></div>'
                    + '<button type="button" class="mf-mini-btn subtle" data-action="reset" data-hash="' + esc(t.hash) + '" data-name="' + esc(t.name) + '">' + esc(tr('torrent.resetState')) + '</button>'
                + '</div>'
            + '</details>'
            + '</div>';

        return '<article class="mf-rich-card' + (compact ? ' compact' : '') + (displayStatus === 'Downloading' ? ' downloading' : '') + '" data-torrent-hash="' + esc(t.hash) + '">'
            + '<div class="mf-cover-slot"><div class="mf-rich-cover-empty">' + esc(mediaMark(t.category)) + '</div></div>'
            + '<div class="mf-rich-body">'
                + '<div class="mf-rich-top">'
                    + '<div style="min-width:0">'
                        + '<div class="mf-rich-title" data-mf-title title="' + esc(t.name) + '">' + esc(t.name) + '</div>'
                        + '<div class="mf-rich-release" data-mf-release>' + esc(t.name) + '</div>'
                        + '<div class="mf-torrent-meta">'
                            + '<span class="mf-badge">' + esc(t.category || '—') + '</span>'
                            + '<span class="mf-badge ' + statusClass(displayStatus) + '">' + esc(statusLabel(displayStatus)) + '</span>'
                            + '<span data-mf-seasons></span>'
                            + '<span class="mf-badge ' + esc(qbStatus.className) + '">' + esc(qbStatus.label) + '</span>'
                        + '</div>'
                    + '</div>'
                    + actions
                + '</div>'
                + '<div class="mf-rich-progress">'
                    + '<div>'
                        + '<div class="mf-progress-row"><strong>' + pct.toFixed(1) + '%</strong><span class="mf-secondary">' + esc(sizeText) + '</span></div>'
                        + '<div class="mf-progress"><span style="width:' + pct + '%"></span></div>'
                    + '</div>'
                    + '<div class="mf-rich-summary">' + torrentFileStats(t) + '</div>'
                + '</div>'
                + '<div class="mf-hash" title="' + esc(t.hash) + '">' + esc(String(t.hash || '').slice(0, compact ? 12 : 20)) + '</div>'
            + '</div>'
            + (!compact ? '<div class="mf-details" data-mf-details><div class="mf-detail-loading">' + esc(tr('torrent.detailsHint')) + '</div></div>' : '')
        + '</article>';
    }

    function filePriorityLabel(priority) {
        const p = Number(priority);
        if (p === 0) return tr('priority.disabled');
        if (p === 7) return tr('priority.maximum');
        if (p === 6) return tr('priority.high');
        if (p === 1) return tr('priority.normal');
        return tr('priority.other', {value:String(priority == null ? '—' : priority)});
    }

    function fileStateBadge(f) {
        const status = f && f.stateStatus ? String(f.stateStatus) : '';
        if (status) {
            return '<span class="mf-badge ' + statusClass(status) + '">' + esc(statusLabel(status)) + '</span>';
        }

        const pct = Math.max(0, Math.min(100, Number((f && f.progress) || 0) * 100));
        const priority = Number((f && f.priority) == null ? 1 : f.priority);

        // qBittorrent state is meaningful even before MediaFlow creates a persistent
        // state entry for the file. Do not call an actively downloading episode
        // "Не отслеживается".
        if (priority === 0) {
            return '<span class="mf-badge warn">' + esc(tr('file.disabled')) + '</span>';
        }

        if (pct >= 99.999) {
            return '<span class="mf-badge info">' + esc(tr('file.ready')) + '</span>';
        }

        if (pct > 0) {
            return '<span class="mf-badge info downloading">'
                + esc(priority === 7 ? tr('file.downloadingMaximum') : tr('file.downloading'))
                + '</span>';
        }

        return '<span class="mf-badge">' + esc(tr('file.waiting')) + '</span>';
    }

    function renderTorrentFileRow(f) {
        const pct = Math.max(0, Math.min(100, Number(f.progress || 0) * 100));
        const episode = f.season != null && f.episode != null
            ? 'S' + String(f.season).padStart(2, '0') + 'E' + String(f.episode).padStart(2, '0')
            : (pct >= 99.999 ? 'FILE' : 'WAIT');
        let linkText = '—';
        let linkClass = 'warn';
        if (f.sameHardlink === true) {
            linkText = 'Hardlink OK';
            linkClass = 'ok';
        } else if (f.destinationExists && f.sameHardlink === false) {
            linkText = tr('file.conflict');
            linkClass = 'err';
        } else if (f.destinationExists) {
            linkText = tr('file.inJellyfin');
            linkClass = 'warn';
        } else if (f.stateStatus === 'Imported') {
            linkText = tr('file.missingJellyfin');
            linkClass = 'err';
        }
        const title = f.message ? ' title="' + esc(f.message) + '"' : '';
        return '<div class="mf-file-row"' + title + '>'
            + '<div class="mf-file-episode">' + esc(episode) + '</div>'
            + '<div class="mf-file-name" title="' + esc(f.name) + '">' + esc(f.name) + '<div class="mf-secondary">' + fmtBytes(f.size) + '</div></div>'
            + '<div class="mf-file-progress">' + pct.toFixed(1) + '% · ' + esc(filePriorityLabel(f.priority)) + '<div style="margin-top:.25rem">' + fileStateBadge(f) + '</div></div>'
            + '<div class="mf-hardlink ' + linkClass + '">' + esc(linkText) + '</div>'
        + '</div>';
    }

    function normalizedSeasons(media) {
        if (!media) return [];
        const values = Array.isArray(media.seasons) ? media.seasons.slice() : [];
        if (!values.length && media.season != null) values.push(media.season);
        return Array.from(new Set(values.map(function(x) { return Number(x); }).filter(function(x) { return Number.isFinite(x); }))).sort(function(a, b) { return a - b; });
    }

    function seasonLabel(media) {
        const seasons = normalizedSeasons(media);
        if (!seasons.length) return '';
        if (seasons.length === 1) return tr('season.one', {season:seasons[0]});
        return tr('season.many', {seasons:seasons.join('–')});
    }

    function seasonChipsHtml(media, compact) {
        const seasons = normalizedSeasons(media);
        if (!seasons.length) return '';
        const maxVisible = compact ? 3 : seasons.length;
        const visible = seasons.slice(0, maxVisible);
        let html = '<span class="mf-season-chips">'
            + visible.map(function(season) {
                return '<span class="mf-badge season">' + esc(tr('season.one', {season:season})) + '</span>';
            }).join('');
        if (seasons.length > visible.length) {
            html += '<span class="mf-badge season">+' + esc(seasons.length - visible.length) + '</span>';
        }
        return html + '</span>';
    }

    function mediaDisplayTitle(media, fallback) {
        if (!media) return fallback || tr('media.generic');
        return (media.title || fallback || 'Media') + (media.year ? ' (' + media.year + ')' : '');
    }

    function renderTorrentDetails(details) {
        const files = Array.isArray(details.files) ? details.files : [];
        const media = details.media || null;
        const mediaLine = media
            ? '<span class="mf-badge info">TMDb #' + esc(media.tmdbId) + '</span>'
                + '<span class="mf-badge">' + esc(media.kind || 'Media') + '</span>'
                + seasonChipsHtml(media, false)
            : '<span class="mf-secondary">' + esc(details.identityStatus === 'IdentityNeedsReview' ? tr('identity.review') : (details.identityStatus === 'IdentityFailed' ? tr('identity.failed', {message:details.identityMessage || tr('identity.error')}) : tr('identity.pending'))) + '</span>';
        return '<div class="mf-detail-head"><div><div class="mf-detail-title">' + esc(tr('torrent.filesTitle')) + '</div><div class="mf-rich-summary">' + mediaLine + '</div></div>'
            + '<div class="mf-secondary">' + esc(tr('torrent.detailsSummary', {imported:details.importedFiles || 0, downloaded:details.completedFiles || 0, eligible:details.eligibleFiles || 0})) + '</div></div>'
            + '<div class="mf-file-list">' + (files.length ? files.map(renderTorrentFileRow).join('') : '<div class="mf-empty">' + esc(tr('torrent.noEligibleFiles')) + '</div>') + '</div>';
    }

    function applyTorrentIdentity(card, details) {
        if (!card || !details) return;
        const media = details.media;
        if (media) {
            const titleEl = card.querySelector('[data-mf-title]');
            const releaseEl = card.querySelector('[data-mf-release]');
            if (titleEl) titleEl.textContent = mediaDisplayTitle(media, details.name || tr('media.generic'));
            if (releaseEl) releaseEl.textContent = details.name || '';
            const seasonsEl = card.querySelector('[data-mf-seasons]');
            if (seasonsEl) seasonsEl.innerHTML = seasonChipsHtml(media, card.classList.contains('compact'));
            const slot = card.querySelector('.mf-cover-slot');
            if (slot && media.posterPath) {
                slot.innerHTML = '<img class="mf-rich-cover" loading="lazy" src="' + esc(posterBase + media.posterPath) + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';"><div class="mf-rich-cover-empty" style="display:none">' + esc(mediaMark(details.category)) + '</div>';
            }
        }
    }

    async function loadTorrentDetails(hash, card, expand) {
        if (!hash || !card) return;
        if (expand) card.classList.add('expanded');
        const panel = card.querySelector('[data-mf-details]');
        if (torrentDetailsCache.has(hash)) {
            const cached = torrentDetailsCache.get(hash);
            applyTorrentIdentity(card, cached);
            if (panel) panel.innerHTML = renderTorrentDetails(cached);
            return;
        }
        if (panel) panel.innerHTML = '<div class="mf-detail-loading">' + esc(tr('torrent.detailsLoading')) + '</div>';
        try {
            const details = await api('GET', 'MediaFlow/Admin/torrents/' + encodeURIComponent(hash) + '/details?stamp=' + Date.now());
            torrentDetailsCache.set(hash, details);
            applyTorrentIdentity(card, details);
            if (panel) panel.innerHTML = renderTorrentDetails(details);
        } catch (err) {
            if (panel) panel.innerHTML = '<div class="mf-empty">' + esc(tr('torrent.detailsFailed')) + '</div>';
            console.error(err);
        }
    }

    function hydrateRecentCards() {
        const overviewCards = Array.from(page.querySelectorAll('#mfOverviewTorrents .mf-rich-card')).slice(0, 5);
        const queueCards = Array.from(page.querySelectorAll('#mfTorrentCards .mf-rich-card')).slice(0, 8);
        const grouped = new Map();

        overviewCards.concat(queueCards).forEach(function(card) {
            const hash = card.dataset.torrentHash;
            if (!hash) return;
            if (!grouped.has(hash)) grouped.set(hash, []);
            grouped.get(hash).push(card);
        });

        grouped.forEach(function(cards, hash) {
            const first = cards[0];
            loadTorrentDetails(hash, first, false).then(function() {
                const details = torrentDetailsCache.get(hash);
                if (!details) return;
                cards.slice(1).forEach(function(card) {
                    applyTorrentIdentity(card, details);
                });
            });
        });
    }

    function historyRow(h, compact) {
        let action = '';
        if (h.status === 'NeedsReview') {
            action = '<button type="button" class="mf-mini-btn" data-action="open-review" data-key="' + esc(h.key) + '">' + esc(tr('common.open')) + '</button>';
        } else if (h.status === 'Failed' || h.status === 'Ignored') {
            action = '<button type="button" class="mf-mini-btn" data-action="retry-state" data-key="' + esc(h.key) + '">Retry</button>';
        }

        if (compact) {
            return '<tr>'
                + '<td><span class="mf-badge ' + statusClass(h.status) + '">' + esc(statusLabel(h.status)) + '</span></td>'
                + '<td class="mf-path"><strong>' + esc(fileName(h.sourcePath)) + '</strong><div class="mf-secondary">' + esc(h.sourcePath || '—') + '</div></td>'
                + '<td>' + (h.tmdbId ? '#' + esc(h.tmdbId) : '—') + '</td>'
                + '<td>' + fmtDate(h.updatedAt) + '</td>'
                + '<td>' + action + '</td>'
            + '</tr>';
        }

        return '<tr>'
            + '<td><span class="mf-badge ' + statusClass(h.status) + '">' + esc(statusLabel(h.status)) + '</span></td>'
            + '<td class="mf-path"><strong>' + esc(fileName(h.sourcePath)) + '</strong><div class="mf-secondary">' + esc(h.sourcePath || '—') + '<br>' + esc(h.key) + '</div></td>'
            + '<td class="mf-path mf-secondary">' + esc(h.destinationPath || '—') + '</td>'
            + '<td>' + (h.tmdbId ? '#' + esc(h.tmdbId) : '—') + '</td>'
            + '<td class="mf-path">' + esc(h.message || '—') + '</td>'
            + '<td>' + fmtDate(h.updatedAt) + '</td>'
            + '<td>' + action + '</td>'
        + '</tr>';
    }

    function candidateCard(candidate, key) {
        const poster = candidate.posterPath
            ? '<img class="mf-poster" loading="lazy" src="' + esc(posterBase + candidate.posterPath) + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';"><div class="mf-poster-empty" style="display:none">' + esc(tr('review.noPoster')) + '</div>'
            : '<div class="mf-poster-empty">' + esc(tr('review.noPoster')) + '</div>';
        const year = candidate.year ? ' (' + esc(candidate.year) + ')' : '';
        const original = candidate.originalTitle && candidate.originalTitle !== candidate.title
            ? '<div class="mf-candidate-original">' + esc(candidate.originalTitle) + '</div>'
            : '';
        const score = Number(candidate.score || 0) > 0
            ? '<span class="mf-badge ' + (Number(candidate.score) >= 82 ? 'ok' : 'warn') + '">' + esc(tr('review.score', {score:Number(candidate.score).toFixed(1)})) + '</span>'
            : '<span class="mf-badge info">' + esc(tr('review.manualSearch')) + '</span>';
        const episode = candidate.episodeTitle
            ? '<div class="mf-secondary">' + esc(tr('review.episode', {title:candidate.episodeTitle})) + (candidate.episodeAirYear ? ' · ' + esc(candidate.episodeAirYear) : '') + '</div>'
            : '';
        const reasons = Array.isArray(candidate.reasons) && candidate.reasons.length
            ? '<div class="mf-secondary">' + esc(candidate.reasons.join(' · ')) + '</div>'
            : '';

        return '<div class="mf-candidate">'
            + '<div>' + poster + '</div>'
            + '<div class="mf-candidate-info">'
                + '<div class="mf-candidate-title">' + esc(candidate.title || tr('review.untitled')) + year + '</div>'
                + original
                + '<div class="mf-candidate-score">' + score + '<span class="mf-badge">TMDb #' + esc(candidate.id) + '</span></div>'
                + episode + reasons
                + '<div class="mf-candidate-actions"><button type="button" class="mf-mini-btn primary" data-action="review-approve" data-key="' + esc(key) + '" data-tmdb-id="' + esc(candidate.id) + '">' + esc(tr('common.choose')) + '</button></div>'
            + '</div>'
        + '</div>';
    }

    function reviewItem(h) {
        const candidates = reviewSearchResults.has(h.key) ? reviewSearchResults.get(h.key) : (Array.isArray(h.reviewCandidates) ? h.reviewCandidates : []);
        const canManual = h.kind === 'Movie' || h.kind === 'Episode';
        const episodeText = h.kind === 'Episode' && h.season != null && h.episode != null
            ? '<span class="mf-badge info">S' + String(h.season).padStart(2, '0') + 'E' + String(h.episode).padStart(2, '0') + '</span>'
            : '';
        const candidateHtml = candidates.length
            ? candidates.map(function(c) { return candidateCard(c, h.key); }).join('')
            : '<div class="mf-empty">' + esc(tr('review.noCandidates')) + '</div>';
        const searchDisabled = canManual ? '' : ' disabled';
        const oldEntryNote = canManual ? '' : '<div class="mf-review-reason">' + esc(tr('review.oldEntry')) + '</div>';

        return '<article class="mf-review-item" data-review-key="' + esc(h.key) + '">'
            + '<div class="mf-review-head">'
                + '<div>'
                    + '<div class="mf-review-title">' + esc(fileName(h.sourcePath)) + '</div>'
                    + '<div class="mf-torrent-meta"><span class="mf-badge warn">' + esc(tr('status.needsReview')) + '</span>' + episodeText + (h.kind ? '<span class="mf-badge">' + esc(h.kind) + '</span>' : '') + '</div>'
                    + '<div class="mf-review-reason">' + esc(h.message || tr('review.defaultReason')) + '</div>'
                    + '<div class="mf-secondary">' + esc(h.sourcePath || '') + '</div>'
                    + oldEntryNote
                + '</div>'
                + '<div class="mf-actions">'
                    + '<button type="button" class="mf-mini-btn" data-action="retry-state" data-key="' + esc(h.key) + '">' + esc(tr('common.retryAnalysis')) + '</button>'
                    + '<button type="button" class="mf-mini-btn danger" data-action="review-ignore" data-key="' + esc(h.key) + '">' + esc(tr('common.ignore')) + '</button>'
                + '</div>'
            + '</div>'
            + '<div class="mf-review-body">'
                + '<div class="mf-review-searchbar">'
                    + '<input class="mf-review-search" type="text" is="emby-input" placeholder="" data-i18n-placeholder="search.review"' + searchDisabled + ' />'
                    + '<button type="button" class="mf-mini-btn" data-action="review-search" data-key="' + esc(h.key) + '"' + searchDisabled + '>' + esc(tr('common.searchTmdb')) + '</button>'
                + '</div>'
                + '<div class="mf-candidates">' + candidateHtml + '</div>'
            + '</div>'
        + '</article>';
    }

    function renderHealth() {
        if (!overview) return;
        const workerValue = overview.workerEnabled ? (overview.dryRunMode ? 'Dry Run' : 'ON') : 'OFF';
        setHealth('mfHealthWorker', Boolean(overview.workerEnabled), workerValue, overview.workerEnabled ? 'MediaFlow worker enabled' : 'MediaFlow worker disabled', Boolean(overview.dryRunMode));
        setHealth('mfHealthQb', Boolean(overview.qbittorrentConnected), overview.qbittorrentConnected ? 'Connected' : 'Error', overview.qbittorrentMessage || '', false);
        setHealth('mfHealthTmdb', Boolean(overview.tmdbConnected), overview.tmdbConnected ? 'Connected' : 'Error', overview.tmdbMessage || '', false);

        const workerBadge = page.querySelector('#mfSettingsWorkerBadge');
        workerBadge.textContent = workerValue;
        workerBadge.className = 'mf-badge ' + (overview.workerEnabled ? (overview.dryRunMode ? 'warn' : 'ok') : 'err');
        const qbBadge = page.querySelector('#mfSettingsQbBadge');
        qbBadge.textContent = overview.qbittorrentConnected ? tr('common.connected') : tr('common.error');
        qbBadge.className = 'mf-badge ' + (overview.qbittorrentConnected ? 'ok' : 'err');
        qbBadge.title = overview.qbittorrentMessage || '';
        const tmdbBadge = page.querySelector('#mfSettingsTmdbBadge');
        tmdbBadge.textContent = overview.tmdbConnected ? tr('common.connected') : tr('common.error');
        tmdbBadge.className = 'mf-badge ' + (overview.tmdbConnected ? 'ok' : 'err');
        tmdbBadge.title = overview.tmdbMessage || '';
    }

    function renderOverview() {
        if (!overview) return;
        page.querySelector('#mfVersion').textContent = overview.pluginVersion ? 'v' + overview.pluginVersion : '';
        page.querySelector('#mfMetricActive').textContent = overview.activeCount || 0;
        page.querySelector('#mfMetricReview').textContent = overview.needsReviewCount || 0;
        page.querySelector('#mfMetricFailed').textContent = overview.failedCount || 0;
        page.querySelector('#mfMetricImported').textContent = overview.importedCount || 0;
        page.querySelector('#mfMetricImportedNote').textContent = (overview.baselineCount || 0) + ' baseline · ' + (overview.ignoredCount || 0) + ' ignored';
        page.querySelector('#mfTabTorrentCount').textContent = overview.torrentCount || 0;
        page.querySelector('#mfTabReviewCount').textContent = overview.needsReviewCount || 0;
        renderHealth();

        const torrents = (overview.torrents || []).slice(0, 5);
        page.querySelector('#mfOverviewTorrents').innerHTML = torrents.length
            ? torrents.map(function(x) { return torrentCard(x, true); }).join('')
            : '<div class="mf-empty">' + esc(tr('torrent.none')) + '</div>';

        const history = (overview.history || []).slice(0, 8);
        page.querySelector('#mfOverviewHistory').innerHTML = history.length
            ? history.map(function(x) { return historyRow(x, true); }).join('')
            : '<tr><td colspan="5" class="mf-secondary">' + esc(tr('empty.history')) + '</td></tr>';

        renderQueue();
        renderHistory();
        renderReview();
    }

    function renderQueue() {
        if (!overview) return;
        const q = String(page.querySelector('#mfTorrentSearch').value || '').toLowerCase();
        const filter = page.querySelector('#mfTorrentFilter').value || 'all';
        const rows = (overview.torrents || []).filter(function(t) {
            const displayStatus = effectiveTorrentStatus(t);
            const searchOk = !q || [t.name,t.hash,t.category,displayStatus,t.mediaFlowStatus,t.qbState].join(' ').toLowerCase().includes(q);
            const filterOk = filter === 'all' || displayStatus === filter;
            return searchOk && filterOk;
        });
        page.querySelector('#mfTorrentCards').innerHTML = rows.length
            ? rows.map(function(x) { return torrentCard(x, false); }).join('')
            : '<div class="mf-empty">' + esc(tr('empty.search')) + '</div>';
        if (rows.length) setTimeout(hydrateRecentCards, 0);
    }

    function renderHistory() {
        if (!overview) return;
        const q = String(page.querySelector('#mfHistorySearch').value || '').toLowerCase();
        const rows = (overview.history || []).filter(function(h) {
            return !q || [h.status,h.sourcePath,h.destinationPath,h.message,h.tmdbId,h.kind].join(' ').toLowerCase().includes(q);
        });
        page.querySelector('#mfHistoryTable').innerHTML = rows.length
            ? rows.map(function(x) { return historyRow(x, false); }).join('')
            : '<tr><td colspan="7" class="mf-secondary">' + esc(tr('empty.history')) + '</td></tr>';
    }

    function renderReview() {
        if (!overview) return;
        const rows = (overview.history || []).filter(function(h) { return h.status === 'NeedsReview'; });
        page.querySelector('#mfReviewCards').innerHTML = rows.length
            ? rows.map(reviewItem).join('')
            : '<div class="mf-empty">' + esc(tr('review.none')) + '</div>';
    }

    function logLevelBadge(level) {
        const value = String(level || 'Information');
        const cls = value === 'Error' ? 'err' : (value === 'Warning' ? 'warn' : (value === 'Information' ? 'ok' : 'info'));
        return '<span class="mf-badge ' + cls + '">' + esc(value) + '</span>';
    }

    function renderLogs() {
        const list = page.querySelector('#mfLogList');
        if (!list) return;
        const q = String(page.querySelector('#mfLogSearch').value || '').toLowerCase();
        const level = page.querySelector('#mfLogLevel').value || 'all';
        const rows = (logEntries || []).filter(function(x) {
            const levelOk = level === 'all' || x.level === level;
            const searchOk = !q || [x.message,x.source,x.torrentName,x.torrentHash,x.fileName].join(' ').toLowerCase().includes(q);
            return levelOk && searchOk;
        });
        list.innerHTML = rows.length ? rows.map(function(x) {
            const context = [x.torrentName, x.fileName, x.torrentHash ? String(x.torrentHash).slice(0, 12) : ''].filter(Boolean).join(' · ');
            return '<div class="mf-log-row ' + String(x.level || '').toLowerCase() + '">'
                + '<div class="mf-log-time">' + esc(fmtDate(x.timestamp)) + '</div>'
                + '<div>' + logLevelBadge(x.level) + '</div>'
                + '<div class="mf-log-source">' + esc(x.source || 'MediaFlow') + '</div>'
                + '<div class="mf-log-message">' + esc(x.message || '') + (context ? '<div class="mf-log-context">' + esc(context) + '</div>' : '') + '</div>'
            + '</div>';
        }).join('') : '<div class="mf-empty">' + esc(tr('empty.logs')) + '</div>';
    }

    async function loadLogs(showLoading) {
        if (showLoading) Dashboard.showLoadingMsg();
        try {
            const r = await api('GET', 'MediaFlow/Admin/logs?limit=500&stamp=' + Date.now());
            logEntries = Array.isArray(r.logs) ? r.logs : [];
            renderLogs();
        } catch (err) {
            console.error(err);
            const list = page.querySelector('#mfLogList');
            if (list) list.innerHTML = '<div class="mf-empty">' + esc(tr('error.logsLoad')) + '</div>';
        } finally {
            if (showLoading) Dashboard.hideLoadingMsg();
        }
    }

    async function refreshOverview(showLoading) {
        if (showLoading) Dashboard.showLoadingMsg();
        try {
            overview = await api('GET', 'MediaFlow/Admin/overview?stamp=' + Date.now());
            torrentDetailsCache.clear();
            renderOverview();
        } catch (e) {
            console.error(e);
            toast(tr('error.mediaflowLoad', {message:(e.statusText || e.message || e)}));
        } finally {
            if (showLoading) Dashboard.hideLoadingMsg();
        }
    }

    async function loadSettings() {
        const config = await ApiClient.getPluginConfiguration(pluginUniqueId);
        window.__mfConfigCache = config;
        checkIds.forEach(function(id) {
            const el = page.querySelector('#' + id);
            if (el) el.checked = Boolean(config[id]);
        });
        textIds.forEach(function(id) {
            const el = page.querySelector('#' + id);
            if (el) el.value = config[id] == null ? '' : config[id];
        });
    }

    async function saveSettings() {
        const config = await ApiClient.getPluginConfiguration(pluginUniqueId);
        checkIds.forEach(function(id) {
            const el = page.querySelector('#' + id);
            if (el) config[id] = el.checked;
        });
        textIds.forEach(function(id) {
            const el = page.querySelector('#' + id);
            if (!el) return;
            config[id] = el.type === 'number' ? Number(el.value) : el.value;
        });
        window.__mfConfigCache = config;
        const result = await ApiClient.updatePluginConfiguration(pluginUniqueId, config);
        Dashboard.processPluginConfigurationUpdateResult(result);
        await refreshOverview(false);
    }

    function findReviewItem(key) {
        const items = Array.from(page.querySelectorAll('.mf-review-item'));
        return items.find(function(x) { return x.dataset.reviewKey === key; }) || null;
    }

    page.addEventListener('click', async function(e) {
        const tab = e.target.closest('[data-tab]');
        if (tab) {
            setTab(tab.dataset.tab);
            return;
        }
        const go = e.target.closest('[data-go-tab]');
        if (go) {
            setTab(go.dataset.goTab);
            return;
        }
        const action = e.target.closest('[data-action]');
        if (!action) return;

        try {
            if (action.dataset.action === 'toggle-details') {
                const card = action.closest('.mf-rich-card');
                if (!card) return;
                const willOpen = !card.classList.contains('expanded');
                card.classList.toggle('expanded', willOpen);
                action.textContent = willOpen ? tr('common.hideFiles') : tr('common.files');
                if (willOpen) await loadTorrentDetails(action.dataset.hash, card, true);
            } else if (action.dataset.action === 'reconcile') {
                Dashboard.showLoadingMsg();
                const r = await api('POST', 'MediaFlow/Admin/torrents/' + encodeURIComponent(action.dataset.hash) + '/reconcile');
                torrentDetailsCache.delete(action.dataset.hash);
                toast(tr('toast.reconcile', {completed:r.completedFiles,total:r.qBittorrentFiles,healthy:r.healthyImported,missing:r.missingInJellyfin,conflicts:r.differentDestination,untracked:r.untrackedCompleted}));
                await refreshOverview(false);
            } else if (action.dataset.action === 'reprocess') {
                if (!confirm(tr('confirm.reprocess'))) return;
                Dashboard.showLoadingMsg();
                const r = await api('POST', 'MediaFlow/Admin/torrents/' + encodeURIComponent(action.dataset.hash) + '/reprocess');
                torrentDetailsCache.delete(action.dataset.hash);
                toast(tr('toast.reprocess', {removed:r.removed, stale:r.staleImported || 0}));
                await refreshOverview(false);
            } else if (action.dataset.action === 'delete-jellyfin') {
                if (!confirm(tr('confirm.deleteJellyfin', {name:action.dataset.name || 'torrent'}))) return;
                Dashboard.showLoadingMsg();
                const r = await api('POST', 'MediaFlow/Admin/torrents/' + encodeURIComponent(action.dataset.hash) + '/delete-jellyfin');
                torrentDetailsCache.delete(action.dataset.hash);
                toast(tr('toast.jellyfinDelete', {deleted:r.deletedFiles, missing:r.missingFiles, conflicts:r.conflicts}));
                await refreshOverview(false);
            } else if (action.dataset.action === 'delete-qb') {
                if (!confirm(tr('confirm.deleteQb', {name:action.dataset.name || 'torrent'}))) return;
                Dashboard.showLoadingMsg();
                const r = await api('POST', 'MediaFlow/Admin/torrents/' + encodeURIComponent(action.dataset.hash) + '/delete-qbittorrent?deleteFiles=false');
                torrentDetailsCache.delete(action.dataset.hash);
                toast(tr('toast.qbDeleted'));
                await refreshOverview(false);
            } else if (action.dataset.action === 'delete-qb-files') {
                if (!confirm(tr('confirm.deleteQbFiles', {name:action.dataset.name || 'torrent'}))) return;
                Dashboard.showLoadingMsg();
                const r = await api('POST', 'MediaFlow/Admin/torrents/' + encodeURIComponent(action.dataset.hash) + '/delete-qbittorrent?deleteFiles=true');
                torrentDetailsCache.delete(action.dataset.hash);
                toast(tr('toast.qbFilesDeleted'));
                await refreshOverview(false);
            } else if (action.dataset.action === 'reset') {
                if (!confirm(tr('confirm.reset', {name:action.dataset.name || 'torrent'}))) return;
                Dashboard.showLoadingMsg();
                const r = await api('POST', 'MediaFlow/Admin/torrents/' + encodeURIComponent(action.dataset.hash) + '/reset');
                torrentDetailsCache.delete(action.dataset.hash);
                toast(tr('toast.stateReset', {count:r.removed}));
                await refreshOverview(false);
            } else if (action.dataset.action === 'retry-state') {
                Dashboard.showLoadingMsg();
                const r = await api('POST', 'MediaFlow/Admin/state/retry?key=' + encodeURIComponent(action.dataset.key));
                reviewSearchResults.delete(action.dataset.key);
                toast(tr('toast.stateRetry'));
                await refreshOverview(false);
            } else if (action.dataset.action === 'open-review') {
                setTab('review');
                setTimeout(function() {
                    const item = findReviewItem(action.dataset.key);
                    if (item) item.scrollIntoView({behavior:'smooth', block:'center'});
                }, 50);
            } else if (action.dataset.action === 'review-search') {
                const item = action.closest('.mf-review-item');
                const input = item ? item.querySelector('.mf-review-search') : null;
                const query = input ? String(input.value || '').trim() : '';
                if (!query) {
                    toast(tr('toast.enterTmdb'));
                    return;
                }
                Dashboard.showLoadingMsg();
                const r = await api('GET', 'MediaFlow/Admin/review/search?key=' + encodeURIComponent(action.dataset.key) + '&query=' + encodeURIComponent(query));
                reviewSearchResults.set(action.dataset.key, Array.isArray(r.candidates) ? r.candidates : []);
                renderReview();
                toast(tr('toast.tmdbFound', {count:r.candidates ? r.candidates.length : 0}));
            } else if (action.dataset.action === 'review-approve') {
                const tmdbId = Number(action.dataset.tmdbId || 0);
                if (!tmdbId) return;
                if (!confirm(tr('confirm.approve', {id:tmdbId}))) return;
                Dashboard.showLoadingMsg();
                const r = await api('POST', 'MediaFlow/Admin/review/approve', { key: action.dataset.key, tmdbId: tmdbId });
                reviewSearchResults.delete(action.dataset.key);
                toast(tr('toast.imported', {title:r.title || 'TMDb #' + tmdbId}));
                await refreshOverview(false);
            } else if (action.dataset.action === 'review-ignore') {
                if (!confirm(tr('confirm.ignore'))) return;
                Dashboard.showLoadingMsg();
                const r = await api('POST', 'MediaFlow/Admin/review/ignore?key=' + encodeURIComponent(action.dataset.key));
                reviewSearchResults.delete(action.dataset.key);
                toast(tr('toast.reviewIgnored'));
                await refreshOverview(false);
            }
        } catch (err) {
            console.error(err);
            let message = err && (err.statusText || err.message) ? (err.statusText || err.message) : String(err);
            if (err && err.responseText) {
                try {
                    const parsed = JSON.parse(err.responseText);
                    if (parsed.message) message = parsed.message;
                } catch (_) { }
            }
            toast(tr('error.operation', {message:message}));
        } finally {
            Dashboard.hideLoadingMsg();
        }
    });

    page.querySelector('#mfRefreshTop').addEventListener('click', function() { refreshOverview(true); });
    page.querySelector('#mfTorrentSearch').addEventListener('input', renderQueue);
    page.querySelector('#mfTorrentFilter').addEventListener('change', renderQueue);
    page.querySelector('#mfHistorySearch').addEventListener('input', renderHistory);
    page.querySelector('#mfLogSearch').addEventListener('input', renderLogs);
    page.querySelector('#mfLogLevel').addEventListener('change', renderLogs);
    page.querySelector('#mfLogRefresh').addEventListener('click', function() { loadLogs(true); });
    page.querySelector('#mfLogClear').addEventListener('click', async function() {
        if (!confirm(tr('confirm.clearLogs'))) return;
        Dashboard.showLoadingMsg();
        try {
            await api('POST', 'MediaFlow/Admin/logs/clear');
            logEntries = [];
            renderLogs();
            toast(tr('toast.logsCleared'));
        } catch (err) {
            console.error(err);
            toast(tr('toast.logsClearFailed'));
        } finally {
            Dashboard.hideLoadingMsg();
        }
    });
    page.querySelector('#MediaFlowConfigForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        Dashboard.showLoadingMsg();
        try {
            await saveSettings();
            toast(tr('toast.settingsSaved'));
        } catch (err) {
            console.error(err);
            toast(tr('toast.settingsSaveFailed'));
        } finally {
            Dashboard.hideLoadingMsg();
        }
        return false;
    });

    let mfInitRunning = false;
    async function initializePage() {
        if (mfInitRunning) return;
        mfInitRunning = true;
        Dashboard.showLoadingMsg();
        try {
            await loadLocalization();
            await loadSettings();
            await refreshOverview(false);
        } catch (err) {
            console.error('MediaFlow UI initialization failed', err);
            toast(tr('error.init'));
        } finally {
            Dashboard.hideLoadingMsg();
            mfInitRunning = false;
        }
    }

    page.addEventListener('pageshow', initializePage);
    page.addEventListener('viewshow', initializePage);
    console.info('MediaFlow UI v0.1.20 script loaded');
    queueMicrotask(initializePage);
})();
</script>
</div>
</body>
</html>
